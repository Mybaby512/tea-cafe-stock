<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยืนยันการลบข้อมูล</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4 text-center">
            <h3 class="text-danger mb-3">⚠️ ยืนยันการลบ</h3>
            <p>คุณต้องการลบพนักงาน <strong>{{ employee.first_name }} {{ employee.last_name }}</strong> ใช่หรือไม่?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100">ยืนยันการลบ</button>
                <a href="{% url 'employee_list' %}" class="btn btn-secondary w-100 mt-2">ยกเลิก</a>
            </form>
        </div>
    </div>
</body>
</html>
