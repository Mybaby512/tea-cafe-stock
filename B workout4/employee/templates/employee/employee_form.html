<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>บันทึกข้อมูลพนักงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3 text-center">Form ข้อมูลพนักงาน</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">บันทึกข้อมูล</button>
                <a href="{% url 'employee_list' %}" class="btn btn-secondary w-100 mt-2">ย้อนกลับ</a>
            </form>
        </div>
    </div>
</body>
</html>
