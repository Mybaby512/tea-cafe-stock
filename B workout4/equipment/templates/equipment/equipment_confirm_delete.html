<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันการลบอุปกรณ์ | Workout Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b10; color: #f1f1f1; font-family: 'Kanit', sans-serif; }
        .card-custom { background: #14141e; border: 1px solid rgba(255, 68, 68, 0.3); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4 text-center">
                    <h4 class="text-danger fw-bold mb-3">⚠️ ยืนยันการลบอุปกรณ์</h4>
                    <p class="text-muted">ต้องการลบอุปกรณ์ <strong>{{ equipment.name }}</strong> ({{ equipment.code }}) ออกจากคลังใช่หรือไม่?</p>
                    <form method="POST" class="d-flex justify-content-center gap-3 mt-4">
                        {% csrf_token %}
                        <a href="{% url 'equipment_list' %}" class="btn btn-outline-secondary rounded-pill px-4">ยกเลิก</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4">ยืนยันลบ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
