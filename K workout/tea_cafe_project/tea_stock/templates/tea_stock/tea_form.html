<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8f9fa; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #ced4da; }
        .form-control:focus, .form-select:focus { border-color: #2D5A27; box-shadow: 0 0 0 0.2rem rgba(45, 90, 39, 0.15); }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="card p-4 p-md-5 w-100" style="max-width: 600px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-success" style="color: #2D5A27 !important;">🧋 {{ title }}</h3>
                <p class="text-muted small">กรอกรายละเอียดข้อมูลเมนูชาหรือสต็อกสินค้าให้ครบถ้วน</p>
            </div>

            <!-- เพิ่ม enctype สำหรับรับไฟล์รูปภาพ -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger py-2 small mb-3">
                        <strong>เกิดข้อผิดพลาด:</strong> กรุณาตรวจสอบข้อมูลในช่องที่ไฮไลท์
                    </div>
                {% endif %}

                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'tea_list' %}" class="btn btn-light px-4 py-2 border rounded-3 text-secondary">ย้อนกลับ</a>
                    <button type="submit" class="btn btn-success px-5 py-2 rounded-3 fw-semibold shadow-sm" style="background-color: #2D5A27;">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
