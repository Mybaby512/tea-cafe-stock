<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยืนยันการลบสินค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow border-0 p-4 p-md-5 rounded-4 text-center" style="max-width: 480px; width: 100%;">
            <div class="mb-3 text-danger">
                <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
            </div>
            <h3 class="text-danger fw-bold mb-2">ยืนยันการลบข้อมูล</h3>
            <p class="text-muted mb-4">คุณต้องการลบเมนู <strong>"{{ item.name }}"</strong> ออกจากระบบใช่หรือไม่? การกระทำนี้ไม่สามารถกู้คืนได้</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'tea_list' %}" class="btn btn-light px-4 py-2 border rounded-3 text-secondary">ยกเลิก</a>
                    <button type="submit" class="btn btn-danger px-4 py-2 rounded-3 shadow-sm">ยืนยันการลบ</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
